name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-suite:
    # The offline suite needs no browser and no real Chrome profile — it runs on fakes and
    # temp directories — so it is fast and hermetic. latchkey itself targets macOS (it reads
    # Chrome's macOS cookie store and keystore); the tests run there.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (library + dev deps, no browser download)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Create disposable Chrome profile fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3

          root = Path.home() / "Library/Application Support/Google/Chrome"
          for name in ("Default", "Profile 2", "Profile 3"):
              directory = root / name
              directory.mkdir(parents=True, exist_ok=True)
              with sqlite3.connect(directory / "Cookies") as connection:
                  connection.execute(
                      "CREATE TABLE cookies (host_key TEXT, name TEXT, encrypted_value BLOB, "
                      "expires_utc INTEGER, is_secure INTEGER, is_httponly INTEGER, "
                      "path TEXT, samesite INTEGER, has_expires INTEGER, "
                      "is_persistent INTEGER, top_frame_site_key TEXT)"
                  )
          PY
      - name: Offline test suite
        run: python -m unittest discover -s tests -v
