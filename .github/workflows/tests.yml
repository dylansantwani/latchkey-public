name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-suite:
    # The offline suite needs no browser and no real Chrome profile — it runs on fakes and
    # temp directories — so it is fast and hermetic. latchkey itself targets macOS (it reads
    # Chrome's macOS cookie store and keystore); the tests run there.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (library + dev deps, no browser download)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Offline test suite
        run: python -m unittest discover -s tests -v
